[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alias-manager"
version = "0.1.0"
description = "An easy way to manage .bashrc aliases."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "pyside6-essentials==6.11.1",
]

[project.urls]
Homepage = "https://github.com/abdulrahman-103/Alias-Manager"
Issues = "https://github.com/abdulrahman-103/Alias-Manager/issues"

[project.gui-scripts]
alias-manager = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
